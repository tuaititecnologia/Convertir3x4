name: Build Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: Convertir3x4-windows
            artifact-path: dist/Convertir3x4.exe
          - os: macos-latest
            artifact-name: Convertir3x4-macos
            artifact-path: dist/Convertir3x4
          - os: ubuntu-latest
            artifact-name: Convertir3x4-linux
            artifact-path: dist/Convertir3x4

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller Convertir3x4.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mv artifacts/Convertir3x4-windows/Convertir3x4.exe Convertir3x4-windows.exe
          mv artifacts/Convertir3x4-macos/Convertir3x4 Convertir3x4-macos
          mv artifacts/Convertir3x4-linux/Convertir3x4 Convertir3x4-linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Convertir3x4-windows.exe
            Convertir3x4-macos
            Convertir3x4-linux
          generate_release_notes: true
