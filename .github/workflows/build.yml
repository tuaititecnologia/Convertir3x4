name: Build Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: Convertir3x4-windows
            artifact-path: dist/Convertir3x4.exe
          - os: macos-latest
            artifact-name: Convertir3x4-macos
            artifact-path: dist/Convertir3x4.dmg
          - os: ubuntu-latest
            artifact-name: Convertir3x4-linux
            artifact-path: dist/Convertir3x4

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write version file
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION = \"${VERSION}\"" > _version.py

      - name: Build executable
        run: pyinstaller Convertir3x4.spec

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Convertir3x4" \
            --window-size 540 380 \
            --icon-size 120 \
            --icon "Convertir3x4.app" 140 180 \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "dist/Convertir3x4.dmg" \
            "dist/Convertir3x4.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mv artifacts/Convertir3x4-windows/Convertir3x4.exe "Convertir3x4-${VERSION}-windows.exe"
          mv artifacts/Convertir3x4-macos/Convertir3x4.dmg "Convertir3x4-${VERSION}-macos.dmg"
          mv artifacts/Convertir3x4-linux/Convertir3x4 "Convertir3x4-${VERSION}-linux"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Convertir3x4-${{ github.ref_name }}-windows.exe
            Convertir3x4-${{ github.ref_name }}-macos.dmg
            Convertir3x4-${{ github.ref_name }}-linux
          generate_release_notes: true

  # Catalogador del NAS (docs/catalogado-en-el-nas.md): imagen con la misma
  # etiqueta que el .exe. En PRs y en main solo se arma; se publica con cada tag.
  catalogador:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.catalogador
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/tuaititecnologia/convertir3x4-catalogador:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Catalogador del NAS de Convertir3x4
